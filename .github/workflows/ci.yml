name: CI tienda-api

on:
  pull_request:
    branches: [main]

jobs:
  pruebas:
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      ALUMNO: Huayhuas David
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas
        run: npm test

      - name: Notificar éxito a Slack
        if: success()
        run: node notificar.mjs exito "PR #${{ github.event.pull_request.number }} (${{ github.head_ref }})"

      - name: Notificar error a Slack
        if: failure()
        run: node notificar.mjs error "PR #${{ github.event.pull_request.number }} (${{ github.head_ref }})"
